name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Reject fork PRs
        id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { allowOpenCode } = require('./.github/scripts/opencode-gate.cjs')
            return await allowOpenCode({ context, github })

      - name: Install project tools
        if: steps.gate.outputs.result == 'true'
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
        with:
          version: '2026.10.25'
          cache: false
          install_args: --locked
          experimental: true

      - name: Install OpenCode V1
        if: steps.gate.outputs.result == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          curl --fail --location --retry 3 \
            https://github.com/anomalyco/opencode/releases/download/v1.19.5/opencode-linux-x64-baseline.tar.gz \
            --output "$archive"
          echo "17c200fd4b2289954cc01552559f9b6d03ec157b2ddfb5eb54144f491656333d  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode-bin" opencode
          "$RUNNER_TEMP/opencode-bin/opencode" --version

      - name: Check project skills
        if: steps.gate.outputs.result == 'true'
        shell: bash
        env:
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
          OPENCODE_CONFIG_CONTENT: '{"share":"disabled","instructions":["{env:GITHUB_WORKSPACE}/AGENTS.md"],"skills":{"paths":[".opencode/skills"]}}'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/opencode-bin/opencode" debug skill > "$RUNNER_TEMP/opencode-skills.json"
          node -e '
            const skills = require(process.env.RUNNER_TEMP + "/opencode-skills.json");
            for (const name of ["to-spec", "to-tickets", "implement-spec"]) {
              if (!skills.some((skill) => skill.name === name)) throw new Error(`Missing skill: ${name}`);
              console.log(`Available: ${name}`);
            }
          '

      - name: Run OpenCode GitHub agent
        if: steps.gate.outputs.result == 'true'
        shell: bash
        env:
          MODEL: opencode/deepseek-v4.1-flash-free
          MENTIONS: /opencode,/oc
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
          OPENCODE_CONFIG_CONTENT: '{"share":"disabled","instructions":["{env:GITHUB_WORKSPACE}/AGENTS.md"],"small_model":"opencode/deepseek-v4.1-flash-free","skills":{"paths":[".opencode/skills"]}}'
        run: '"$RUNNER_TEMP/opencode-bin/opencode" github run'
