name: opencode

run-name: >-
  ${{ github.event.comment.user.type == 'User' &&
  github.event.comment.user.login == github.repository_owner &&
  (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
  github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode ')) &&
  (github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number)) &&
  format('OpenCode PR #{0}', github.event.pull_request.number || github.event.issue.number) || 'OpenCode comment' }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') ||
       github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode '))
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      pr: ${{ steps.gate.outputs.pr }}
      sha: ${{ steps.gate.outputs.sha }}
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.agent.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify command, repository and remaining budget
        id: gate
        timeout-minutes: 4
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { getOpenCodeTarget } = require('./.github/scripts/opencode-gate.cjs')
            const { checkBudget } = require('./.github/scripts/opencode-budget.cjs')
            const target = await getOpenCodeTarget({ context, github })
            if (!target) return
            if (!target.number) {
              core.setOutput('decision', 'allowed')
              return
            }
            core.setOutput('pr', target.number)
            core.setOutput('sha', target.sha)
            const allowed = await checkBudget({
              github, repo: context.repo, id: context.runId,
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT), number: target.number,
            })
            core.setOutput('decision', allowed ? 'allowed' : 'limit_exhausted')
            if (!allowed) core.notice('limit_exhausted: model invocation skipped')

      - name: Install project tools
        if: steps.gate.outputs.decision == 'allowed'
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
        with:
          version: '2026.10.25'
          cache: false
          install_args: --locked
          experimental: true

      - name: Install OpenCode V1
        if: steps.gate.outputs.decision == 'allowed'
        shell: bash
        run: bash .github/scripts/install-opencode.sh

      - name: Install project dependencies and browser for implementation
        if: >-
          steps.gate.outputs.decision == 'allowed' &&
          (steps.gate.outputs.pr != '' || contains(github.event.comment.body, 'implement-spec'))
        shell: bash
        run: |
          mise run setup
          mise run setup:e2e

      - name: Check project skills
        if: steps.gate.outputs.decision == 'allowed'
        shell: bash
        env:
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
          OPENCODE_CONFIG_CONTENT: '{"share":"disabled","instructions":["{env:GITHUB_WORKSPACE}/AGENTS.md"],"skills":{"paths":[".opencode/skills"]}}'
        run: |
          set -euo pipefail
          opencode debug skill > "$RUNNER_TEMP/opencode-skills.json"
          node -e '
            const skills = require(process.env.RUNNER_TEMP + "/opencode-skills.json");
            for (const name of ["to-spec", "to-tickets", "implement-spec"]) {
              if (!skills.some((skill) => skill.name === name)) throw new Error(`Missing skill: ${name}`);
              console.log(`Available: ${name}`);
            }
          '

      - name: Run OpenCode GitHub agent
        if: steps.gate.outputs.decision == 'allowed'
        id: agent
        timeout-minutes: 27
        shell: bash
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'opencode/deepseek-v4.1-flash-free' }}
          MENTIONS: /opencode,/oc
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_DISABLE_PROJECT_CONFIG: 'true'
          OPENCODE_CONFIG_CONTENT: '{"share":"disabled","instructions":["{env:GITHUB_WORKSPACE}/AGENTS.md"],"skills":{"paths":[".opencode/skills"]}}'
        run: |
          set -euo pipefail
          if [[ -z "$OPENCODE_API_KEY" ]]; then
            echo "reason=infra" >> "$GITHUB_OUTPUT"
            echo "::error::Missing OPENCODE_API_KEY"
            exit 1
          fi
          case "$OPENCODE_MODEL" in
            opencode/deepseek-v4.1-flash-free|opencode/mimo-v2.6-flash-free|opencode/flint-40b-free) ;;
            *)
              echo "reason=infra" >> "$GITHUB_OUTPUT"
              echo "::error::OPENCODE_MODEL must be a supported free OpenCode model"
              exit 1
              ;;
          esac
          echo "OpenCode model: $OPENCODE_MODEL"
          OPENCODE_CONFIG_CONTENT=$(node -p 'JSON.stringify({ ...JSON.parse(process.env.OPENCODE_CONFIG_CONTENT), small_model: process.env.OPENCODE_MODEL })')
          export OPENCODE_CONFIG_CONTENT MODEL="$OPENCODE_MODEL"
          code=0
          timeout --kill-after=20s 25m opencode github run || code=$?
          case "$code" in
            0) exit 0 ;;
            124|137) reason=timeout ;;
            125|126|127) reason=infra ;;
            *) reason=agent_failed ;;
          esac
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          exit "$code"

  report:
    needs: opencode
    if: >-
      always() && needs.opencode.outputs.pr != '' &&
      (needs.opencode.outputs.decision == 'limit_exhausted' || needs.opencode.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Report why human assistance is needed
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.opencode.outputs.pr }}
          CHECKED_HEAD: ${{ needs.opencode.outputs.sha }}
          DECISION: ${{ needs.opencode.outputs.decision }}
          REASON: ${{ needs.opencode.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          reason=${REASON:-infra}
          if [[ "$DECISION" == limit_exhausted ]]; then reason=$DECISION; fi
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid) || sha=$CHECKED_HEAD
          logs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          printf 'Нужен человек: `%s`.\n\nПоследний head SHA: `%s`.\n\n[Логи запуска](%s)\n' "$reason" "$sha" "$logs" \
            | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
